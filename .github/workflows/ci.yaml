name: Java CI
on:
  push:
    branches-ignore:
      - 'gh-pages'
    paths-ignore:
      - '**.md'
      - '**.markdown'
      - '**/README*'
  pull_request:
    branches-ignore:
      - 'gh-pages'
    paths-ignore:
      - '**.md'
      - '**.markdown'
      - '**/README*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '24'
          distribution: 'temurin'
      - name: Build and Test
        run: mvn clean test -U
      - name: Generate Core JaCoCo Badge
        id: jacoco_mug
        uses: cicirello/jacoco-badge-generator@f33476a5a3fd5a4f77cb5eef2ebe728c1dd5b921 # v2.11.0
        with:
          jacoco-csv-file: mug/target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: true
          branches-badge-filename: mug-branches.svg
          generate-summary: true
          summary-filename: mug-summary.json
          coverage-badge-filename: mug-coverage.svg
      - name: Generate dot-parse JaCoCo Badge
        id: jacoco_dot_parse
        uses: cicirello/jacoco-badge-generator@f33476a5a3fd5a4f77cb5eef2ebe728c1dd5b921 # v2.11.0
        with:
          jacoco-csv-file: dot-parse/target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: true
          branches-badge-filename: dot-parse-branches.svg
          generate-summary: true
          summary-filename: dot-parse-summary.json
          coverage-badge-filename: dot-parse-coverage.svg
      - name: Generate safe-sql JaCoCo Badge
        id: jacoco_safesql
        uses: cicirello/jacoco-badge-generator@f33476a5a3fd5a4f77cb5eef2ebe728c1dd5b921 # v2.11.0
        with:
          jacoco-csv-file: >
            mug-safesql/target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: true
          branches-badge-filename: safesql-branches.svg
          generate-summary: true
          summary-filename: mug-safesql-summary.json
          coverage-badge-filename: mug-safesql-coverage.svg
      - name: Generate concurent-24 JaCoCo Badge
        id: jacoco_concurrent24
        uses: cicirello/jacoco-badge-generator@f33476a5a3fd5a4f77cb5eef2ebe728c1dd5b921 # v2.11.0
        with:
          jacoco-csv-file: mug-concurrent24/target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: true
          branches-badge-filename: concurrent24-branches.svg
          generate-summary: true
          summary-filename: mug-concurrent24-summary.json
          coverage-badge-filename: mug-concurrent24-coverage.svg
      - name: Generate mug-guava JaCoCo Badge
        id: jacoco_guava
        uses: cicirello/jacoco-badge-generator@f33476a5a3fd5a4f77cb5eef2ebe728c1dd5b921 # v2.11.0
        with:
          jacoco-csv-file: mug-guava/target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: true
          branches-badge-filename: guava-branches.svg
          generate-summary: true
          summary-filename: mug-guava-summary.json
          coverage-badge-filename: mug-guava-coverage.svg
      - name: Log coverage percentage
        env:
          JACOCO_COV: ${{ steps.jacoco.outputs.coverage }}
          JACOCO_BRANCHES: ${{ steps.jacoco.outputs.branches }}
        run: |
          echo "coverage = ${JACOCO_COV}"
          echo "branch coverage = ${JACOCO_BRANCHES}"

      - name: Commit and push badges
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          # 1. Stage the specific files
          git add .github/badges/*.svg
          git add .github/badges/*.json
          
          # 2. Check if the STAGED changes are different from the last commit
          # git diff --cached --quiet returns 1 if there are differences
          if ! git diff --cached --quiet; then
            git commit -m "Update coverage badges"
            git push
          else
            echo "No changes in coverage results; skipping commit."
          fi

  oss-exit-gate-release:
    name: Publish to Maven Central via OSS Exit Gate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
          token_format: 'access_token'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy artifacts to OSS Exit Gate Artifact Registry
        env:
          TAG_NAME: ${{ github.ref_name }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          cat > /tmp/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>oss-exit-gate</id>
                <username>oauth2accesstoken</username>
                <password>${ACCESS_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn -B -s /tmp/settings.xml deploy -DskipTests \
            -DaltDeploymentRepository=oss-exit-gate::default::https://us-maven.pkg.dev/oss-exit-gate-prod/mug--mavencentral
          python3 - <<'PY'
          import json, os, subprocess
          ver = os.environ["TAG_NAME"].lstrip("v")
          pkgs_out = subprocess.check_output([
              "gcloud", "artifacts", "packages", "list",
              "--project=oss-exit-gate-prod", "--location=us", "--repository=mug--mavencentral",
              "--format=value(name)",
          ], text=True).splitlines()
          pkgs = []
          for p in sorted(pkgs_out):
            pkg_id = p.strip().split("/")[-1]
            if ":" in pkg_id:
              ns, name = pkg_id.split(":", 1)
              pkgs.append({"name": name, "version": ver})
          manifest = {"publish_all": False, "publishing_groups": [{"namespace": "com.google.mug", "packages": pkgs}]}
          open("manifest.json", "w").write(json.dumps(manifest, indent=2))
          PY
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/mug/mavencentral/manifests/manifest-${VERSION}-${RUN_ID}-${RUN_ATTEMPT}.json"
